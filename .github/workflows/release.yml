name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS packages
        run: npm run package:mac -- --${{ matrix.arch }}

      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-mac-*.zip

  windows:
    name: Package Windows (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        run: npm run package:win -- --${{ matrix.arch }}

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: release/*.exe

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "Code Compare ${GITHUB_REF_NAME}"
          --generate-notes
