name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS packages
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run package:mac -- --${{ matrix.arch }} 2>&1 | tee package.log

      - name: Report macOS packaging failure
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "### macOS ${{ matrix.arch }} packaging failure"
            echo '```text'
            tail -n 100 package.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload macOS packages
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-mac-*.zip

  windows:
    name: Package Windows (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          npm run package:win -- --${{ matrix.arch }} 2>&1 |
            Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Report Windows packaging failure
        if: steps.package.outcome == 'failure'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "### Windows ${{ matrix.arch }} packaging failure"
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          Get-Content package.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          exit 1

      - name: Upload Windows installers
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: release/*.exe

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "Code Compare ${GITHUB_REF_NAME}"
          --generate-notes
