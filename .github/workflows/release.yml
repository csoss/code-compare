name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Package macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS packages
        id: package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --mac zip --${{ matrix.arch }} --publish never

            for attempt in 1 2 3; do
              if npx electron-builder --mac dmg --${{ matrix.arch }} --publish never; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "DMG generation failed; retrying (attempt $((attempt + 1))/3)."
                sleep 10
              fi
            done
            exit 1
          } 2>&1 | tee package.log

      - name: Report macOS packaging failure
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          category="unclassified"
          if grep -Eqi 'status code 403|HttpError: 403|response status 403' package.log; then
            category="download-http-403"
          elif grep -Eqi 'status code 404|HttpError: 404|response status 404' package.log; then
            category="download-http-404"
          elif grep -Eqi 'ENOSPC|No space left on device' package.log; then
            category="runner-disk-full"
          elif grep -Eqi 'Application entry file .* does not exist|Cannot find module' package.log; then
            category="application-entry-missing"
          elif grep -Eqi 'ERR_ELECTRON_BUILDER_CANNOT_EXECUTE|cannot execute' package.log; then
            category="builder-tool-cannot-execute"
          elif grep -Eqi 'ERR_ELECTRON_BUILDER_BINARIES_DOWNLOAD|RequestError|download.*failed' package.log; then
            category="builder-download-failed"
          elif grep -Eqi 'GitHub Personal Access Token is not set|GH_TOKEN.*not set' package.log; then
            category="implicit-publish-token-missing"
          elif grep -Eqi 'Resource busy' package.log; then
            category="dmg-resource-busy"
          elif grep -Eqi 'Operation not permitted' package.log; then
            category="dmg-operation-not-permitted"
          elif grep -Eqi 'No mountable file systems' package.log; then
            category="dmg-not-mountable"
          elif grep -Eqi 'hdiutil: (create|convert|attach) failed - Invalid argument' package.log; then
            category="dmg-invalid-argument"
          elif grep -Eqi 'hdiutil|dmgbuild' package.log; then
            category="dmg-generation-failed"
          elif grep -Eqi 'code.?sign|identity|certificate|notari' package.log; then
            category="code-signing-failed"
          elif grep -Eqi 'EACCES|EPERM|permission denied' package.log; then
            category="filesystem-permission-denied"
          elif grep -Eqi 'ENOENT|not found' package.log; then
            category="required-file-or-command-missing"
          fi
          echo "::error title=macOS ${{ matrix.arch }} packaging diagnostic::Category: $category"
          echo "macOS ${{ matrix.arch }} packaging diagnostic category: \`$category\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload macOS packages
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-mac-*.zip

  windows:
    name: Package Windows (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installers
        id: package
        continue-on-error: true
        shell: pwsh
        run: |
          npm run build 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -eq 0) {
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never 2>&1 |
              Tee-Object -FilePath package.log -Append
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Report Windows packaging failure
        if: steps.package.outcome == 'failure'
        shell: pwsh
        run: |
          $content = Get-Content package.log -Raw
          $category = 'unclassified'
          if ($content -match 'status code 403|HttpError: 403|response status 403') {
            $category = 'download-http-403'
          } elseif ($content -match 'status code 404|HttpError: 404|response status 404') {
            $category = 'download-http-404'
          } elseif ($content -match 'ENOSPC|No space left on device') {
            $category = 'runner-disk-full'
          } elseif ($content -match 'Application entry file .* does not exist|Cannot find module') {
            $category = 'application-entry-missing'
          } elseif ($content -match 'ERR_ELECTRON_BUILDER_CANNOT_EXECUTE|cannot execute') {
            $category = 'builder-tool-cannot-execute'
          } elseif ($content -match 'ERR_ELECTRON_BUILDER_BINARIES_DOWNLOAD|RequestError|download.*failed') {
            $category = 'builder-download-failed'
          } elseif ($content -match 'GitHub Personal Access Token is not set|GH_TOKEN.*not set') {
            $category = 'implicit-publish-token-missing'
          } elseif ($content -match 'not a valid zip file') {
            $category = 'nsis-input-archive-invalid'
          } elseif ($content -match 'Cannot create symbolic link') {
            $category = 'builder-cache-symlink-failed'
          } elseif ($content -match 'makensis.*(error|failed)|Error in script') {
            $category = 'nsis-script-failed'
          } elseif ($content -match 'makensis|NSIS') {
            $category = 'nsis-generation-failed'
          } elseif ($content -match 'code.?sign|certificate') {
            $category = 'code-signing-failed'
          } elseif ($content -match 'EACCES|EPERM|permission denied') {
            $category = 'filesystem-permission-denied'
          } elseif ($content -match 'ENOENT|not found') {
            $category = 'required-file-or-command-missing'
          }
          Write-Output "::error title=Windows ${{ matrix.arch }} packaging diagnostic::Category: $category"
          Add-Content $env:GITHUB_STEP_SUMMARY "Windows ${{ matrix.arch }} packaging diagnostic category: ``$category``"
          exit 1

      - name: Upload Windows installers
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-packages
          if-no-files-found: error
          retention-days: 7
          path: release/*.exe

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --repo "${GITHUB_REPOSITORY}"
          --title "Code Compare ${GITHUB_REF_NAME}"
          --generate-notes
